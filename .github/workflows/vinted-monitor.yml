name: Vinted PS5 Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vinted-ps5-monitor
  cancel-in-progress: false

jobs:
  check-vinted:
    name: Check Vinted
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Vinted PS5 monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VINTED_SEARCH_URL: ${{ secrets.VINTED_SEARCH_URL }}
          MIN_PRICE: "200"
          MAX_PRICE: "300"
        run: python -u vinted_ps5_alert.py

      - name: Save listing history
        if: success()
        run: |
          if [ ! -f vinted_seen.json ]; then
            echo "No vinted_seen.json file was created."
            exit 1
          fi

          git config user.name "Vinted PS5 Bot"
          git config user.email "actions@users.noreply.github.com"

          git add vinted_seen.json

          if git diff --cached --quiet; then
            echo "No new listing history to save."
          else
            git commit -m "Update seen Vinted listings [skip ci]"
            git push
          fi
