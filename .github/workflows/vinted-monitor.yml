name: Vinted PS5 Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-vinted:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Check Vinted
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VINTED_SEARCH_URL: ${{ secrets.VINTED_SEARCH_URL }}
          MIN_PRICE: "200"
          MAX_PRICE: "300"
        run: timeout 60s python vinted_ps5_alert.py || true

      - name: Save seen listings
        run: |
          if [ -f vinted_seen.json ]; then
            git config user.name "Vinted PS5 Bot"
            git config user.email "actions@github.com"
            git add vinted_seen.json

            if ! git diff --cached --quiet; then
              git commit -m "Update seen Vinted listings"
              git push
            fi
          fi
